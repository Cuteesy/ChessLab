name: build-linux-deb

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CI: "true"
      CARGO_NET_RETRY: "10"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm || true
          sudo apt-get clean
          df -h /

      - name: Install Tauri system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config patchelf file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev
          df -h /

      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
          pnpm -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Rust build
        continue-on-error: true
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-on-failure: true

      - name: Install JS dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build Linux deb bundle
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tauri build --bundles deb

      - name: Report build outputs
        run: |
          set -euo pipefail
          du -sh app/src-tauri/target/release/chesslab || true
          ls -la app/src-tauri/target/release/bundle/deb/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: chesslab-linux-deb
          path: app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: chesslab-linux-binary
          path: app/src-tauri/target/release/chesslab
          if-no-files-found: error
          retention-days: 14
